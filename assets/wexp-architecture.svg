<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t"><title id="t">Wireless Expander architecture: local ESP32-S3 terminal connected by Wi-Fi TCP to ESP32-C5 diagnostics</title><rect width="1000" height="270" rx="14" fill="#0c1721"/><g font-family="system-ui,sans-serif"><text x="30" y="34" font-size="13" letter-spacing="2" fill="#88a8bb">ARCHITECTURE / CONTROL PLANE</text><rect x="30" y="58" width="290" height="156" rx="10" fill="#142731" stroke="#31e6b0"/><rect x="680" y="58" width="290" height="156" rx="10" fill="#142731" stroke="#62b7ff"/><g font-size="13" font-weight="600"><text x="50" y="82" fill="#31e6b0">01 / LOCAL</text><text x="700" y="82" fill="#62b7ff">02 / REMOTE</text></g><g fill="#f1f7fb" font-size="24" font-weight="700"><text x="50" y="116">Cardputer ADV</text><text x="700" y="116">ESP32-C5</text></g><g fill="#a4c3ce" font-size="15"><text x="50" y="141">ESP32-S3 · BitPirate v1.8</text><text x="50" y="166">Keyboard · display · peripherals</text><text x="50" y="191">Native WEXP terminal</text><text x="700" y="141">Dual-band Wi-Fi · diagnostics</text><text x="700" y="166">One-shot command execution</text><text x="700" y="191">Independent power</text></g><path d="M320 135H680" fill="none" stroke="#6cabb7" stroke-width="2" stroke-dasharray="7 5"/><path d="M330 128L320 135L330 142M670 128L680 135L670 142" fill="none" stroke="#6cabb7" stroke-width="2"/><rect x="395" y="110" width="210" height="50" rx="8" fill="#0c1721" stroke="#36636b"/><text x="500" y="130" font-size="13" text-anchor="middle" fill="#31e6b0" font-family="monospace">TCP :2323</text><text x="500" y="147" text-anchor="middle" font-size="12" fill="#a4c3ce">Framed requests / replies</text><text x="500" y="246" fill="#a4c3ce" text-anchor="middle" font-size="13">Trusted local network · bridge lock protects transport configuration · no UART link between boards</text></g></svg>